<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ollama Chat UI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="app-container">
        <div id="toast-container"></div>
        <aside id="sidebar">
            <h1>Zeus</h1>
            <button id="new-chat-btn" onclick="newChat()">New Chat</button>
            <div id="chat-list"></div>
            <button id="toggle-dark-btn" onclick="toggleDarkMode()">Toggle Dark Mode</button>
        </aside>

        <main id="main-content">
            <div id="chat-container"></div>

            <div id="input-container">
                <textarea id="prompt" placeholder="Type your message..."></textarea>
                <!-- <button id="mic-btn" onclick="startListening()">🎙️</button> -->
                <button id="send-btn" onclick="sendPrompt()">Send</button>
            </div>
        </main>
    </div>

    <script src="chat.js"></script>
</body>

</html>
